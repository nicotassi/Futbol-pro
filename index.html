<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16171A" />
    <meta name="description" content="Futbolista Pro — Entrená. Aprendé. Evolucioná." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Futbolista Pro</title>
    <script>
      // Evita el destello blanco: aplica el tema guardado antes de dibujar la página.
      (function () {
        try {
          var p = localStorage.getItem('fp-theme');
          var dark =
            p === 'dark' ||
            (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark)
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F1013');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
